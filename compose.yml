networks:
  web:
    external: true

services:
  traefik:
    # The official Traefik docker image
    image: traefik:v3.3
    restart: always
    env_file:
      - namecheap.env
    command:
      # - "--log.level=DEBUG"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.docker"
      - "--api"
      ### letsencrypt ACME v2 (aka DNS-01 challenge) config
      - "--certificatesresolvers.letsencrypt.acme.email=gapp.christian+letsencrypt@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=namecheap"
      ### lynq.ing: TLS-ALPN-01 over :443 — no registrar credential, own ACME account
      - "--certificatesresolvers.le-alpn.acme.email=ops@lynq.ing"
      - "--certificatesresolvers.le-alpn.acme.storage=/acme-alpn.json"
      - "--certificatesresolvers.le-alpn.acme.tlschallenge=true"
      ### Auth plugin
      - "--experimental.plugins.traefik-oidc-auth.modulename=github.com/sevensolutions/traefik-oidc-auth"
      - "--experimental.plugins.traefik-oidc-auth.version=v0.13.0"
      - "--serverstransport.insecureskipverify=true"
    ports:
      # The HTTP port
      - "80:80"
      # The HTTP port
      - "443:443"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      # Letsencrypt file
      - ./acme.json:/acme.json
      - ./acme-alpn.json:/acme-alpn.json
      # Basic auth file for traefik dashboard authentication
      - ./.htpasswd:/.htpasswd
    labels:
      # Dashboard
      - "traefik.http.routers.api.rule=Host(`traefik.gappc.net`)"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.middlewares=auth"
      - "traefik.http.routers.api.tls"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.auth.basicauth.usersFile=/.htpasswd"

    networks:
      - web

